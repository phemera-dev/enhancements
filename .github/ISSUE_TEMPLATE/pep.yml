name: PEP tracking issue
description: Propose a significant change to Phemera and track its PEP.
title: "PEP: "
labels: ["pep"]
body:
  - type: markdown
    attributes:
      value: |
        Use this issue to describe the problem and gather early feedback before writing a full PEP.
        See [PEP-0001](https://github.com/phemera-dev/enhancements/blob/main/peps/0001-pep-process/README.md) for the process.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed direction
      description: A rough outline of the change. Details belong in the PEP.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this touch authentication, authorization, credentials, audit logging, or trust boundaries? A short first assessment is enough.
    validations:
      required: true
  - type: input
    id: pep-pr
    attributes:
      label: PEP pull request
      description: Link the pull request once the PEP is written.
